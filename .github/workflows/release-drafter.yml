# Maintains the draft release (categorized changelog) on every merge to main
# and applies conventional-commit labels to PRs (autolabeler, a separate
# sub-action in release-drafter v7).
#
# The autolabeler only runs for same-repo PRs: on the plain pull_request
# trigger the GITHUB_TOKEN is read-only for forks, and labeling is
# best-effort housekeeping, not a gate -- maintainers can label fork PRs
# manually. (pull_request_target would cover forks, but this repo keeps the
# stricter trigger.)
name: Release Drafter

"on":
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  update-release-draft:
    name: Update release draft
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  autolabeler:
    name: Autolabel pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
